<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2ff6b"/>
      <stop offset="1" stop-color="#7dff9a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#c6ff3d" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c6ff3d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
  </g>
  <!-- Trois joueurs : la ligne d'attaque -->
  <circle cx="168" cy="118" r="15" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="256" cy="118" r="15" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="344" cy="118" r="15" fill="#ffffff" fill-opacity="0.85"/>
  <!-- Un T qui est aussi une passe : la barre est le terrain, la tige la trajectoire -->
  <path d="M150 196 H362" stroke="url(#lime)" stroke-width="46" stroke-linecap="round"/>
  <path d="M256 196 V338" stroke="url(#lime)" stroke-width="46" stroke-linecap="round"/>
  <path d="M220 336 L256 404 L292 336 Z" fill="url(#lime)" stroke="url(#lime)" stroke-width="10" stroke-linejoin="round"/>
</svg>
