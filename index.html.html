<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tactik'up">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tactik'up - Accueil</title>
<style>

  /* ===== Thèmes : Graphite (défaut), Aurora, Papier, Néon, Swiss ===== */
  :root {
    --bg: #0a0c11;
    --bg-image: radial-gradient(900px 520px at 0% -8%, rgba(198,255,61,.11), transparent 60%), radial-gradient(800px 520px at 105% 4%, rgba(96,130,255,.15), transparent 60%);
    --surface: var(--surface); --surface-2: var(--surface-2); --field: var(--field);
    --text: #eef1f6; --muted: #c3cad8; --accent: #c6ff3d; --accent-ink: #0a0c11;
    --line: var(--line); --line-strong: var(--line-strong);
    --grid: var(--grid); --dot: var(--dot);
    --pitch: #111826; --pitch-line: rgba(255,255,255,.28); --arrow: #ffffff; --player: #ff5d6c;
    --shadow: rgba(0,0,0,.7);
  }
  :root[data-theme="aurora"] {
    --bg: #0d0b1f;
    --bg-image: radial-gradient(700px 500px at 15% 0%, rgba(124,58,237,.45), transparent 60%), radial-gradient(700px 500px at 90% 20%, rgba(20,184,166,.35), transparent 60%), radial-gradient(600px 500px at 50% 110%, rgba(236,72,153,.3), transparent 60%);
    --surface: var(--field); --surface-2: rgba(255,255,255,.12); --field: var(--line);
    --text: #f5f3ff; --muted: #d2cbec; --accent: #5eead4; --accent-ink: #06201c;
    --line: rgba(255,255,255,.12); --line-strong: rgba(255,255,255,.24);
    --grid: rgba(255,255,255,.02); --dot: rgba(255,255,255,.22);
    --pitch: #1a1538; --pitch-line: rgba(255,255,255,.22); --arrow: #ffffff; --player: #f472b6;
    --shadow: rgba(0,0,0,.5);
  }
  :root[data-theme="paper"] {
    --bg: #f4efe6; --bg-image: none;
    --surface: #fffdf8; --surface-2: #efe8da; --field: #fffdf8;
    --text: #1b1a17; --muted: #55524a; --accent: #e4572e; --accent-ink: #ffffff;
    --line: #e2dacb; --line-strong: #b9af9b;
    --grid: rgba(0,0,0,0); --dot: #cbc2ae;
    --pitch: #e9e1cf; --pitch-line: rgba(27,26,23,.35); --arrow: #1b1a17; --player: #e4572e;
    --shadow: rgba(60,45,20,.12);
  }
  :root[data-theme="neon"] {
    --bg: #080612;
    --bg-image: radial-gradient(600px 400px at 50% -10%, rgba(0,229,255,.18), transparent 60%), linear-gradient(180deg, transparent 55%, rgba(255,0,153,.12) 100%);
    --surface: rgba(0,229,255,.05); --surface-2: rgba(255,46,151,.12); --field: rgba(0,229,255,.06);
    --text: #f2fbff; --muted: #a7c9d9; --accent: #ff2e97; --accent-ink: #ffffff;
    --line: rgba(0,229,255,.2); --line-strong: rgba(0,229,255,.45);
    --grid: rgba(0,229,255,.05); --dot: rgba(0,229,255,.4);
    --pitch: #0d0a1f; --pitch-line: rgba(0,229,255,.35); --arrow: #00e5ff; --player: #ff2e97;
    --shadow: rgba(255,0,153,.15);
  }
  :root[data-theme="swiss"] {
    --bg: #ffffff; --bg-image: none;
    --surface: #f5f5f5; --surface-2: #ececec; --field: #ffffff;
    --text: #0a0a0a; --muted: #4d4d4d; --accent: #e10600; --accent-ink: #ffffff;
    --line: #d9d9d9; --line-strong: #0a0a0a;
    --grid: rgba(0,0,0,0); --dot: #bbbbbb;
    --pitch: #f2f2f2; --pitch-line: rgba(0,0,0,.3); --arrow: #0a0a0a; --player: #e10600;
    --shadow: rgba(0,0,0,.06);
  }
  .themes { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
  .theme-btn { font-size: .9rem; padding: 8px 14px; border-radius: 999px; }
  .theme-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); line-height: 1.5; -webkit-font-smoothing: antialiased;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    background-color: var(--bg);
    background-image: var(--bg-image);
    background-attachment: fixed;
    padding: env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px; -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 70%); mask-image: linear-gradient(to bottom, #000 0%, transparent 70%);
  }
  main { position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 20px 0 64px; }
  h1 { font-size: 2.1rem; font-weight: 800; letter-spacing: -.04em; margin: 10px 0 4px; }
  h2 { font-size: .72rem; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); margin: 30px 0 10px; font-weight: 700; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: .95rem; }
  a { color: var(--accent); text-decoration: none; }
  .card {
    background: var(--surface); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 16px;
    box-shadow: 0 24px 60px -24px var(--shadow);
  }
  select, input, textarea {
    font: inherit; width: 100%; padding: 13px 14px; border-radius: 14px; margin-bottom: 10px;
    border: 1px solid var(--line); background: var(--field); color: var(--text); outline: none;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; }
  button {
    font: inherit; font-weight: 600; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    border-radius: 14px; padding: 11px 16px; cursor: pointer; min-width: 44px; transition: transform .1s, background .2s;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  button.small { padding: 7px 12px; font-size: .82rem; border-radius: 11px; min-width: 0; }
  button.active { background: color-mix(in srgb, var(--accent) 14%, transparent); border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; }
  .swatch { width: 30px; min-width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px var(--line); }
  .swatch.active { border-color: var(--text); }
  .row, .tools, .data, .controls { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .row { justify-content: flex-start; }
  .grid2, .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 480px) { .grid2, .form-grid { grid-template-columns: 1fr; } }
  .hidden { display: none !important; }
  svg { width: 100%; height: auto; display: block; user-select: none; -webkit-user-select: none; border-radius: 18px; }
  svg.drawing, svg.editing { touch-action: none; }
  svg.drawing { cursor: crosshair; }
  svg.editing { cursor: move; }
  .mover { transition: transform var(--move-ms, 900ms) cubic-bezier(.4,0,.2,1); }
  .arrow { fill: none; stroke: var(--arrow); stroke-width: 4; stroke-linecap: round; opacity: .9; }
  .arrow.run { stroke-dasharray: 10 7; stroke-width: 3; }
  .user-stroke { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .caption { min-height: 3em; margin: 14px 0 0; text-align: center; font-weight: 600; font-size: 1.02rem; }
  .dots { display: flex; gap: 7px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot); cursor: pointer; }
  .dot.active { background: var(--accent); box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 60%, transparent); }
  .status { font-size: .82rem; color: var(--muted); text-align: center; margin-top: 10px; min-height: 1.2em; }
  .hint, .legend { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 10px; min-height: 1.2em; }
  .muted { color: var(--muted); font-size: .85rem; }
  ol, ul { padding-left: 20px; margin: 0; }
  li { margin-bottom: 9px; }
  li.step { cursor: pointer; }
  li.current { color: var(--accent); font-weight: 700; }
  ul.list { list-style: none; padding: 0; margin: 0; }
  ul.list li, li.match { list-style: none; margin: 0; padding: 12px 0; border-bottom: 1px solid var(--line); }
  ul.list li:last-child, li.match:last-child { border-bottom: none; }
  li.match.past, ul.list li.past { opacity: .45; }
  li.match small, .muted small { display: block; color: var(--muted); }
  li.match .actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  li.match.hint-item { list-style: none; margin-left: 0; }
  .player { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .player:last-child { border-bottom: none; }
  .player label { flex: 1; font-weight: 600; }
  .player .muted { display: block; margin: 0; font-weight: 400; }
  .poste { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .poste:last-child { border-bottom: none; }
  .poste strong { color: var(--accent); }
  .tag { display: inline-block; font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; margin-left: 6px; text-transform: uppercase; letter-spacing: .06em; }
  .msg-preview { white-space: pre-wrap; background: var(--field); border-radius: 14px; padding: 12px; font-size: .9rem; margin-top: 8px; }
  .section-title { font-weight: 700; margin: 18px 0 8px; }
  input[type="checkbox"] { accent-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .mover { transition: none; } }

  body { display: flex; align-items: center; justify-content: center; }
  main { max-width: 380px; text-align: center; padding: 32px 0; }
  .logo {
    width: 88px; height: 88px; margin: 0 auto 18px; border-radius: 26px;
    background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #ffffff)); color: var(--accent-ink);
    display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; letter-spacing: -.05em;
    box-shadow: 0 20px 50px -10px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .sub { margin-bottom: 30px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    font: inherit; font-weight: 700; font-size: 1rem; padding: 15px; margin-bottom: 12px;
    border-radius: 16px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text);
    text-decoration: none; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn svg { width: 20px; height: 20px; flex-shrink: 0; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: .75rem; margin: 20px 0; text-transform: uppercase; letter-spacing: .14em; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .note { color: var(--muted); font-size: .8rem; margin-top: 18px; line-height: 1.5; }
  .hello { margin-bottom: 22px; font-weight: 600; font-size: 1.1rem; }
  #gsiWrap { margin-bottom: 12px; min-height: 44px; display: flex; justify-content: center; }

  /* Lisibilité : contraste, tailles et espacements renforcés */
  body { font-size: 16px; line-height: 1.6; }
  h1 { font-size: 2.3rem; font-weight: 800; }
  h2 { font-size: .9rem; letter-spacing: .08em; color: var(--text); font-weight: 800; margin: 34px 0 12px; }
  .sub { font-size: 1.05rem; color: var(--muted); margin-bottom: 22px; }
  .card { padding: 20px; }
  input, select, textarea { font-size: 1rem; padding: 14px 15px; border-color: var(--line-strong); background: var(--field); }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .75; }
  button { font-size: 1rem; padding: 12px 18px; border-color: var(--line-strong); }
  button.small { font-size: .9rem; padding: 8px 13px; }
  button.active { color: var(--accent); }
  .caption { font-size: 1.2rem; font-weight: 700; }
  .status, .hint, .legend, .muted { font-size: .95rem; color: var(--muted); }
  .muted { text-align: left; }
  .tag { font-size: .8rem; color: var(--text); border-color: var(--line-strong); text-transform: none; letter-spacing: 0; padding: 2px 10px; }
  li { font-size: 1rem; margin-bottom: 12px; }
  li.current { font-weight: 800; }
  li.match strong, .player label, .poste strong { font-size: 1.05rem; font-weight: 700; }
  li.match small, .muted small, .player .muted { font-size: .95rem; color: var(--muted); }
  .poste { font-size: 1rem; line-height: 1.6; padding: 14px 0; }
  .poste strong { color: var(--accent); }
  .msg-preview { font-size: 1rem; }
  .section-title { font-size: 1.05rem; font-weight: 800; }
  .dot { width: 9px; height: 9px; }
  .note { font-size: .95rem; }
  .divider { font-size: .85rem; color: var(--muted); }
  .btn { font-size: 1.05rem; }

  svg.logo { display: block; margin: 0 auto 18px; width: 96px; height: 96px; filter: drop-shadow(0 20px 40px color-mix(in srgb, var(--accent) 35%, transparent));
    box-shadow: 0 20px 50px -12px rgba(198,255,61,.45); }
  svg.logo { background: none; border-radius: 0; box-shadow: none; font-size: inherit; letter-spacing: 0; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 512 512" width="96" height="96" role="img" aria-label="Logo Tactik'up">
<rect x="0" y="0" width="512" height="512" rx="116" style="fill:var(--surface-2);stroke:var(--line-strong);stroke-width:3"/>
<circle cx="168" cy="118" r="15" style="fill:var(--text);fill-opacity:.85"/>
<circle cx="256" cy="118" r="15" style="fill:var(--text);fill-opacity:.85"/>
<circle cx="344" cy="118" r="15" style="fill:var(--text);fill-opacity:.85"/>
<path d="M150 196 H362" style="stroke:var(--accent);stroke-width:46;stroke-linecap:round;fill:none"/>
<path d="M256 196 V338" style="stroke:var(--accent);stroke-width:46;stroke-linecap:round;fill:none"/>
<path d="M220 336 L256 404 L292 336 Z" style="fill:var(--accent);stroke:var(--accent);stroke-width:10;stroke-linejoin:round"/>
</svg>
  <h1>Tactik'up</h1>
  <p class="sub">Tes compositions, tes schémas et tes dessins de match.</p>

  <!-- Vue connexion -->
  <section id="loginView">
    <div id="gsiWrap"></div>
    <button class="btn" id="googleFallback" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.5 7l7 5.5c4.1-3.8 6.5-9.4 6.5-17z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7-5.5c-2.2 1.5-5 2.3-8.9 2.3-6.3 0-11.7-4-13.6-9.8l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuer avec Google
    </button>
    <button class="btn" id="appleBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M16.4 12.6c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.9c-1.7 0-3.3 1-4.2 2.5-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8s2 .8 3.4.8c1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.2zM14 5.1c.7-.9 1.2-2 1.1-3.1-1 0-2.2.7-2.9 1.6-.6.7-1.2 1.9-1.1 3 1.1.1 2.2-.6 2.9-1.5z"/></svg>
      Continuer avec Apple <span style="font-weight:400;color:var(--muted)">(bientôt)</span>
    </button>

    <div class="divider">ou</div>
    <a class="btn" href="settings.html">Paramètres</a>

    <p class="note" id="configNote">
      Connexion Google : ajoute ton identifiant client Google dans le fichier (constante GOOGLE_CLIENT_ID) pour l'activer.
    </p>
  </section>

  <!-- Vue connecté -->
  <section id="userView" class="hidden">
    <p class="hello" id="hello"></p>
    <a class="btn primary" href="app.html">Ouvrir l'application</a>
    <a class="btn" href="settings.html">Paramètres</a>
    <button class="btn" id="logoutBtn" type="button">Se déconnecter</button>
  </section>
</main>

<script>


  const SETTINGS_KEY = "tactikup-settings";
  const DEFAULT_KIT = [
    { name: "Bleu clair", hex: "#5aa9e6" }, { name: "Bleu foncé", hex: "#1b3a8a" },
    { name: "Jaune", hex: "#ffd60a" }, { name: "Rouge", hex: "#d13a3a" },
    { name: "Blanc", hex: "#f5f5f5" }, { name: "Noir", hex: "#1a1a1a" },
    { name: "Vert", hex: "#2e9e5b" }, { name: "Orange", hex: "#ff7a1a" }
  ];
  const DEFAULT_SETTINGS = { textSize: "normal", animSpeed: "normal", coachName: "", defaultKit: "", rdvMinutes: 30, kitPalette: DEFAULT_KIT };
  const TEXT_PX = { normal: "16px", large: "18px", xl: "20px" };
  const MOVE_MS = { lent: 1400, normal: 900, rapide: 400 };
  const STEP_MS = { lent: 3000, normal: 2200, rapide: 1200 };
  const THEMES = { graphite: "#0a0c11", aurora: "#0d0b1f", paper: "#f4efe6", neon: "#080612", swiss: "#ffffff" };

  function getSettings() {
    try { return { ...DEFAULT_SETTINGS, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; }
    catch (e) { return { ...DEFAULT_SETTINGS }; }
  }
  function applySettings() {
    const s = getSettings();
    document.body.style.fontSize = TEXT_PX[s.textSize] || "16px";
    document.documentElement.style.setProperty("--move-ms", (MOVE_MS[s.animSpeed] || 900) + "ms");
  }
  applySettings();

  function kitColor(p) { return (p && p.kit) || getSettings().kitPalette[0].hex; }
  function kitNameOf(p) {
    const hex = kitColor(p).toLowerCase();
    const k = getSettings().kitPalette.find(x => x.hex.toLowerCase() === hex);
    return k ? k.name : hex;
  }
  // Remplace par ton identifiant client Google (type "Application Web") pour activer la connexion
  const GOOGLE_CLIENT_ID = "";
  const SESSION_KEY = "foot8-session";

  const $ = id => document.getElementById(id);

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; }
  }
  function setSession(user) {
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); } catch (e) {}
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }

  function showUser(user) {
    $("loginView").classList.add("hidden");
    $("userView").classList.remove("hidden");
    $("hello").textContent = "Bonjour " + (user.name || user.email || "") + " 👋";
  }

  // Décode le jeton renvoyé par Google (JWT) pour récupérer le nom et l'e-mail
  function decodeJwt(token) {
    const payload = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
    return JSON.parse(decodeURIComponent(atob(payload).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join("")));
  }

  function onGoogleCredential(resp) {
    try {
      const data = decodeJwt(resp.credential);
      const user = { provider: "google", name: data.name, email: data.email, picture: data.picture };
      setSession(user);
      showUser(user);
    } catch (e) {
      $("configNote").textContent = "La connexion Google a échoué. Réessaie.";
    }
  }

  function initGoogle() {
    if (!GOOGLE_CLIENT_ID || !window.google || !google.accounts) {
      $("googleFallback").disabled = !GOOGLE_CLIENT_ID;
      return;
    }
    $("googleFallback").classList.add("hidden");
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleCredential });
    google.accounts.id.renderButton($("gsiWrap"), { theme: "outline", size: "large", text: "continue_with", shape: "pill", width: 300 });
  }

  // Bouton Google de secours : affiche un message tant que l'identifiant n'est pas configuré
  $("googleFallback").addEventListener("click", () => {
    $("configNote").textContent = "Google n'est pas encore configuré : ajoute GOOGLE_CLIENT_ID dans le fichier.";
  });

  $("logoutBtn").addEventListener("click", () => {
    clearSession();
    $("userView").classList.add("hidden");
    $("loginView").classList.remove("hidden");
  });

  // Chargement du script Google seulement si un identifiant est configuré
  if (GOOGLE_CLIENT_ID) {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true; s.defer = true;
    s.onload = initGoogle;
    document.head.appendChild(s);
  }

  // Si déjà connecté, on affiche directement l'accueil connecté
  const existing = getSession();
  if (existing) showUser(existing);

  (function () {
    const THEMES = { graphite: "#0a0c11", aurora: "#0d0b1f", paper: "#f4efe6", neon: "#080612", swiss: "#ffffff" };
    function applyTheme(t) {
      if (!THEMES[t]) t = "graphite";
      if (t === "graphite") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", t);
      document.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b.dataset.t === t));
      const m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = THEMES[t];
      try { localStorage.setItem("tactikup-theme", t); } catch (e) {}
    }
    document.querySelectorAll(".theme-btn").forEach(b => b.addEventListener("click", () => applyTheme(b.dataset.t)));
    let saved = "graphite";
    try { saved = localStorage.getItem("tactikup-theme") || "graphite"; } catch (e) {}
    applyTheme(saved);
  })();

  // Icône d'écran d'accueil : elle suit le thème choisi au moment de l'ajout à l'écran d'accueil
  (function themeIcon() {
    const PALETTE = {
      graphite: { tile: "#161b24", stroke: "#2e3440", accent: "#c6ff3d", dots: "#eef1f6" },
      aurora:   { tile: "#1a1630", stroke: "#3a3360", accent: "#5eead4", dots: "#f5f3ff" },
      paper:    { tile: "#e9e1cf", stroke: "#b9af9b", accent: "#e4572e", dots: "#1b1a17" },
      neon:     { tile: "#120e24", stroke: "#2a2350", accent: "#ff2e97", dots: "#f2fbff" },
      swiss:    { tile: "#f0f0f0", stroke: "#0a0a0a", accent: "#e10600", dots: "#0a0a0a" }
    };
    let t = "graphite";
    try { t = localStorage.getItem("tactikup-theme") || "graphite"; } catch (e) {}
    const c = PALETTE[t] || PALETTE.graphite;
    const cv = document.createElement("canvas");
    cv.width = cv.height = 180;
    const x = cv.getContext("2d");
    const k = 180 / 512;
    x.scale(k, k);
    const rr = (px, py, w, h, r) => {
      x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r);
      x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath();
    };
    rr(1.5, 1.5, 509, 509, 116); x.fillStyle = c.tile; x.fill();
    x.lineWidth = 3; x.strokeStyle = c.stroke; x.stroke();
    x.fillStyle = c.dots; x.globalAlpha = 0.85;
    [168, 256, 344].forEach(cx => { x.beginPath(); x.arc(cx, 118, 15, 0, Math.PI * 2); x.fill(); });
    x.globalAlpha = 1;
    x.strokeStyle = c.accent; x.fillStyle = c.accent; x.lineCap = "round"; x.lineWidth = 46;
    x.beginPath(); x.moveTo(150, 196); x.lineTo(362, 196); x.stroke();
    x.beginPath(); x.moveTo(256, 196); x.lineTo(256, 338); x.stroke();
    x.beginPath(); x.moveTo(220, 336); x.lineTo(256, 404); x.lineTo(292, 336); x.closePath(); x.fill();
    const link = document.querySelector('link[rel="apple-touch-icon"]');
    if (link) link.href = cv.toDataURL("image/png");
  })();
</script>
</body>
</html>
